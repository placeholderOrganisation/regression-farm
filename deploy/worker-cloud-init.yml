#cloud-config
# Cloud-init for a Regression Farm worker droplet (DigitalOcean).
#
# Replace placeholders before pasting into the "User Data" field:
#   - REPLACE_WITH_YOUR_REPO
#   - REPLACE_WITH_CONTROLLER_PRIVATE_IP   (find via:
#         doctl compute droplet get <controller-name> --format PrivateIPv4 --no-header)
#   - REPLACE_WITH_OPENSSL_RAND_HEX_32     (must match controller's WORKER_TOKEN)
#   - WORKER_NAME (e.g. worker-1, worker-2, worker-3 — must be unique)
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - lsb-release

write_files:
  - path: /opt/regression-farm/.env.worker
    permissions: "0600"
    content: |
      # ---- EDIT BEFORE FIRST BOOT ----
      CONTROLLER_URL=http://REPLACE_WITH_CONTROLLER_PRIVATE_IP:8000
      WORKER_TOKEN=REPLACE_WITH_OPENSSL_RAND_HEX_32
      WORKER_NAME=worker-1
      POLL_INTERVAL=2
      LOG_LEVEL=INFO

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # Pre-create artifact dir on host (worker bind-mounts it into test containers)
  - mkdir -p /tmp/rf-artifacts && chmod 1777 /tmp/rf-artifacts

  # Clone repo
  - git clone REPLACE_WITH_YOUR_REPO /opt/regression-farm/src || true
  - cp /opt/regression-farm/.env.worker /opt/regression-farm/src/.env

  # Discover host docker GID and write to .env so the worker container can read the socket
  - bash -c 'echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" >> /opt/regression-farm/src/.env'

  - cd /opt/regression-farm/src && docker compose -f docker-compose.worker.yml --env-file .env up -d --build
